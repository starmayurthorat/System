<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehadia Infra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f6f7fb]">

<div id="loginPage" class="min-h-screen flex items-center justify-center p-4 bg-[#f6f7fb]">
  <div class="bg-white rounded-[24px] p-8 w-full max-w-[380px] shadow-[0_10px_40px_rgba(0,0,0,0.06)] border">
    <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-white font-extrabold">M</div>
    <h2 class="text-[22px] font-extrabold mt-5 leading-none">Mehadia Infrastructure</h2>
    <p class="text-xs text-slate-500 mt-2">Diesel Management System</p>
    <input id="username" placeholder="Username" class="w-full mt-7 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none focus:bg-white focus:border-slate-900">
    <input id="password" type="password" placeholder="Password" class="w-full mt-3 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none focus:bg-white focus:border-slate-900">
    <button onclick="login()" class="w-full mt-5 py-3.5 rounded-xl bg-slate-900 text-white font-bold hover:bg-black">Login</button>
  </div>
</div>

<div id="appPage" class="hidden">
  <div class="bg-white border-b sticky top-0 z-20 px-6 md:px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3"><div class="w-9 h-9 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">M</div><div><div class="font-extrabold text-[15px]">MEHADIA INFRA</div><div class="text-[10px] text-slate-500 tracking-widest -mt-1">INFRASTRUCTURE</div></div></div>
    <div class="flex items-center gap-2"><span id="roleShow" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 text-[11px] font-bold"></span><button onclick="logout()" class="px-3 py-1.5 rounded-full bg-slate-900 text-white text-[11px] font-bold">Logout</button></div>
  </div>

  <div class="flex flex-col md:flex-row max-w-[1400px] mx-auto">
    <div class="md:w-[250px] p-4"><div class="bg-white rounded-2xl border p-2">
      <button id="btn-entry" onclick="showTab('entry')" class="w-full text-left px-4 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">⛽ Diesel Entry</button>
      <button id="btn-myentry" onclick="showTab('myentry')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm font-semibold mt-1">📋 My Entries</button>
      <div id="adminMenu" class="hidden"><div class="h-[1px] bg-slate-100 my-2"></div>
        <button id="btn-all" onclick="showTab('all')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm">📊 All Entries</button>
        <button id="btn-vehical" onclick="showTab('vehical')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm">🚛 Vehicle</button>
        <button id="btn-site" onclick="showTab('site')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm">📍 Site</button>
        <button id="btn-user" onclick="showTab('user')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm">👤 Users</button>
        <button id="btn-report" onclick="showTab('report')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 text-sm">📈 Report</button>
      </div>
    </div></div>

    <div class="flex-1 p-4 md:p-6">
      <div id="tab-entry" class="bg-white rounded-2xl border p-6 md:p-8 max-w-[650px]"><h3 class="font-bold text-[18px]">New Diesel Entry</h3><p class="text-xs text-slate-500 mt-1">Vehicle select karte hi last closing auto opening ban jayegi</p>
        <label class="text-[11px] font-bold text-slate-500 mt-6 block">VEHICLE SELECT</label>
        <select id="e_vehical" onchange="autoFillOpening()" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none"></select>
        <div id="lastInfo" class="hidden mt-3 px-4 py-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-semibold"></div>
        <label class="text-[11px] font-bold text-slate-500 mt-4 block">SITE</label><select id="e_site" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none"></select>
        <div class="grid grid-cols-2 gap-3 mt-4"><div><label class="text-[11px] font-bold text-slate-500">DATE</label><input type="date" id="e_date" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none"></div><div><label class="text-[11px] font-bold text-slate-500">DIESEL (LTR)</label><input type="number" id="e_ltr" placeholder="Ex: 50" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none"></div></div>
        <div class="grid grid-cols-2 gap-3 mt-4"><div><label class="text-[11px] font-bold text-slate-500">OPENING READING (Auto)</label><input type="number" id="e_open" placeholder="Auto ayega" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-slate-50 border outline-none"></div><div><label class="text-[11px] font-bold text-slate-500">CLOSING READING</label><input type="number" id="e_close" placeholder="Closing" class="w-full mt-2 px-5 py-3.5 rounded-xl bg-white border-2 border-slate-900 outline-none font-bold"></div></div>
        <button id="saveBtn" onclick="saveEntry()" class="w-full mt-6 py-3.5 rounded-xl bg-slate-900 text-white font-bold">Save Entry</button><button id="updateBtn" onclick="updateEntry()" class="hidden w-full mt-6 py-3.5 rounded-xl bg-blue-600 text-white font-bold">Update Entry</button>
      </div>

      <div id="tab-myentry" class="hidden bg-white rounded-2xl border p-6"><h3 class="font-bold">My Entries</h3><div class="flex gap-2 mt-4 flex-wrap"><input type="date" id="my_from" class="px-4 py-2.5 rounded-xl bg-slate-50 border text-sm"><input type="date" id="my_to" class="px-4 py-2.5 rounded-xl bg-slate-50 border text-sm"><button onclick="filterMy()" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold">Filter</button></div><div id="myTable" class="mt-6 overflow-auto"></div></div>
      <div id="tab-all" class="hidden bg-white rounded-2xl border p-6"><h3 class="font-bold">All Users Entries (Admin)</h3><div id="allTable" class="mt-4 overflow-auto"></div></div>
      <div id="tab-vehical" class="hidden bg-white rounded-2xl border p-6 max-w-xl"><h3 class="font-bold">Vehicle List</h3><div class="flex gap-2 mt-4"><input id="vehical_no" placeholder="Vehicle No" class="flex-1 px-5 py-3 rounded-xl bg-slate-50 border"><button onclick="addVehical()" id="vehicalBtn" class="px-6 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">Add</button></div><div id="vehicalList" class="mt-5"></div></div>
      <div id="tab-site" class="hidden bg-white rounded-2xl border p-6 max-w-xl"><h3 class="font-bold">Site List</h3><div class="flex gap-2 mt-4"><input id="site_name" placeholder="Site Name" class="flex-1 px-5 py-3 rounded-xl bg-slate-50 border"><button onclick="addSite()" id="siteBtn" class="px-6 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">Add</button></div><div id="siteList" class="mt-5"></div></div>
      <div id="tab-user" class="hidden bg-white rounded-2xl border p-6 max-w-xl"><h3 class="font-bold">Users</h3><input id="u_name" placeholder="Username" class="w-full mt-4 px-5 py-3 rounded-xl bg-slate-50 border"><input id="u_pass" placeholder="Password" class="w-full mt-3 px-5 py-3 rounded-xl bg-slate-50 border"><button onclick="addUser()" id="userBtn" class="w-full mt-3 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">Create User</button><div id="userList" class="mt-5"></div></div>
      <div id="tab-report" class="hidden bg-white rounded-2xl border p-6"><h3 class="font-bold">Report</h3><div class="flex gap-2 mt-4 flex-wrap"><input type="date" id="r_from" class="px-4 py-2.5 rounded-xl bg-slate-50 border text-sm"><input type="date" id="r_to" class="px-4 py-2.5 rounded-xl bg-slate-50 border text-sm"><button onclick="genReport()" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold">Generate</button><button onclick="exportCSV()" class="px-5 py-2.5 rounded-xl bg-white border text-sm font-bold">Excel</button></div><div id="reportTable" class="mt-6 overflow-auto"></div><div id="totalLtr" class="mt-4 font-bold"></div></div>
    </div>
  </div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('mehadia_final_db'))||{users:[{username:'admin',password:'admin123',role:'admin'},{username:'user1',password:'user123',role:'user'},{username:'user2',password:'user123',role:'user'},{username:'user3',password:'user123',role:'user'}],vehical:['MH-34 AB 1234','MH-34 CD 5678'],site:['Tukum Site','Chandrapur Bypass'],entries:[]};
let currentUser=null, editId=null, editVehicalIdx=null, editSiteIdx=null, editUserIdx=null;
function save(){localStorage.setItem('mehadia_final_db',JSON.stringify(db))}
function login(){let u=username.value,p=password.value,f=db.users.find(x=>x.username===u&&x.password===p);if(!f){alert("Wrong");return}currentUser=f;loginPage.style.display='none';appPage.classList.remove('hidden');roleShow.innerText=f.username+" • "+f.role.toUpperCase();if(f.role==='admin')adminMenu.classList.remove('hidden');loadAll();showTab('entry')}
function logout(){location.reload()}
function showTab(t){document.querySelectorAll('[id^="tab-"]').forEach(d=>d.classList.add('hidden'));document.getElementById('tab-'+t).classList.remove('hidden');if(t==='myentry')filterMy();if(t==='all')loadAllEntries();if(t==='vehical')loadVehical();if(t==='site')loadSite();if(t==='user')loadUsers()}
function loadAll(){e_vehical.innerHTML=db.vehical.map(g=>`<option>${g}</option>`).join('');e_site.innerHTML=db.site.map(s=>`<option>${s}</option>`).join('');e_date.valueAsDate=new Date();autoFillOpening()}

// ** YEH NAYA LOGIC HAI - AUTO OPENING **
function autoFillOpening(){
  let veh = e_vehical.value;
  if(!veh) return;
  let last = db.entries.filter(e=>e.vehical===veh).sort((a,b)=>b.id-a.id)[0];
  if(last && last.close){
    e_open.value = last.close;
    lastInfo.classList.remove('hidden');
    lastInfo.innerText = `Last Closing of ${veh} was ${last.close} KM on ${last.date} - Auto filled in Opening`;
  } else {
    e_open.value = '';
    lastInfo.classList.add('hidden');
  }
}

function saveEntry(){let e={id:Date.now(),user:currentUser.username,vehical:e_vehical.value,site:e_site.value,date:e_date.value,ltr:e_ltr.value,open:e_open.value,close:e_close.value};if(!e.ltr||!e.close)return alert("Ltr aur Closing bharo");db.entries.push(e);save();e_ltr.value='';e_close.value='';alert("Saved!");autoFillOpening();if(currentUser.role==='admin')loadAllEntries();}
function tableHtml(data){return `<table class="w-full text-[12px]"><tr class="bg-slate-50 text-slate-500"><th class="p-3 text-left">Date</th><th class="p-3 text-left">User</th><th class="p-3 text-left">Vehicle</th><th class="p-3 text-left">Site</th><th class="p-3">Ltr</th><th class="p-3">Opening</th><th class="p-3">Closing</th><th class="p-3">Run</th><th class="p-3">Action</th></tr>${data.map(e=>{let run=(e.close&&e.open)?(e.close-e.open):'-';return `<tr class="border-t"><td class="p-3">${e.date}</td><td class="p-3 font-semibold">${e.user}</td><td class="p-3 font-bold">${e.vehical}</td><td class="p-3">${e.site}</td><td class="p-3 font-bold">${e.ltr}</td><td class="p-3">${e.open||'-'}</td><td class="p-3 font-bold">${e.close||'-'}</td><td class="p-3">${run}</td><td class="p-3 flex gap-1"><button onclick="editEntry(${e.id})" class="px-2.5 py-1 bg-slate-100 rounded-full text-[11px] font-bold">Edit</button><button onclick="delEntry(${e.id})" class="px-2.5 py-1 bg-red-50 text-red-600 rounded-full text-[11px] font-bold">Del</button></td></tr>`}).join('')}</table>`}
function filterMy(){let from=my_from.value,to=my_to.value;let data=db.entries.filter(e=>e.user===currentUser.username);if(from)data=data.filter(e=>e.date>=from);if(to)data=data.filter(e=>e.date<=to);myTable.innerHTML=tableHtml(data)}
function loadAllEntries(){allTable.innerHTML=tableHtml(db.entries.slice().reverse())}
function editEntry(id){let e=db.entries.find(x=>x.id===id);editId=id;e_vehical.value=e.vehical;e_site.value=e.site;e_date.value=e.date;e_ltr.value=e.ltr;e_open.value=e.open;e_close.value=e.close;showTab('entry');saveBtn.classList.add('hidden');updateBtn.classList.remove('hidden')}
function updateEntry(){let e=db.entries.find(x=>x.id===editId);e.vehical=e_vehical.value;e.site=e_site.value;e.date=e_date.value;e.ltr=e_ltr.value;e.open=e_open.value;e.close=e_close.value;save();editId=null;saveBtn.classList.remove('hidden');updateBtn.classList.add('hidden');loadAllEntries();filterMy();showTab(currentUser.role==='admin'?'all':'myentry')}
function delEntry(id){if(!confirm("Delete?"))return;db.entries=db.entries.filter(x=>x.id!==id);save();loadAllEntries();filterMy();genReport()}

function addVehical(){if(editVehicalIdx!==null){db.vehical[editVehicalIdx]=vehical_no.value;editVehicalIdx=null;vehicalBtn.innerText="Add"}else{if(!vehical_no.value)return;db.vehical.push(vehical_no.value)}save();vehical_no.value='';loadVehical();loadAll()}
function loadVehical(){vehicalList.innerHTML=db.vehical.map((g,i)=>`<div class="p-3.5 bg-slate-50 rounded-xl flex justify-between mt-2 text-sm"><span class="font-bold">${g}</span><span><button onclick="editVehical(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px]">Edit</button> <button onclick="delVehical(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px] text-red-600">Del</button></span></div>`).join('')}
function editVehical(i){vehical_no.value=db.vehical[i];editVehicalIdx=i;vehicalBtn.innerText="Update"}
function delVehical(i){if(confirm("Delete?")){db.vehical.splice(i,1);save();loadVehical();loadAll()}}

function addSite(){if(editSiteIdx!==null){db.site[editSiteIdx]=site_name.value;editSiteIdx=null;siteBtn.innerText="Add"}else{if(!site_name.value)return;db.site.push(site_name.value)}save();site_name.value='';loadSite();loadAll()}
function loadSite(){siteList.innerHTML=db.site.map((s,i)=>`<div class="p-3.5 bg-slate-50 rounded-xl flex justify-between mt-2 text-sm"><span>${s}</span><span><button onclick="editSite(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px]">Edit</button> <button onclick="delSite(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px] text-red-600">Del</button></span></div>`).join('')}
function editSite(i){site_name.value=db.site[i];editSiteIdx=i;siteBtn.innerText="Update"}
function delSite(i){if(confirm("Delete?")){db.site.splice(i,1);save();loadSite();loadAll()}}

function addUser(){if(editUserIdx!==null){db.users[editUserIdx].username=u_name.value;db.users[editUserIdx].password=u_pass.value;editUserIdx=null;userBtn.innerText="Create"}else{if(db.users.filter(x=>x.role==='user').length>=3)return alert("Max 3");if(!u_name.value)return;db.users.push({username:u_name.value,password:u_pass.value,role:'user'})}save();u_name.value='';u_pass.value='';loadUsers()}
function loadUsers(){userList.innerHTML=db.users.map((u,i)=>`<div class="p-3.5 bg-slate-50 rounded-xl flex justify-between mt-2 text-sm"><span><b>${u.username}</b> (${u.role})</span><span>${u.role!=='admin'?`<button onclick="editUser(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px]">Edit</button> <button onclick="delUser(${i})" class="px-2.5 py-1 bg-white border rounded-full text-[11px] text-red-600">Del</button>`:''}</span></div>`).join('')}
function editUser(i){u_name.value=db.users[i].username;u_pass.value=db.users[i].password;editUserIdx=i;userBtn.innerText="Update"}
function delUser(i){if(confirm("Delete?")){db.users.splice(i,1);save();loadUsers()}}

function genReport(){let from=r_from.value,to=r_to.value,data=db.entries;if(from)data=data.filter(e=>e.date>=from);if(to)data=data.filter(e=>e.date<=to);let total=data.reduce((s,e)=>s+parseFloat(e.ltr||0),0);reportTable.innerHTML=tableHtml(data);totalLtr.innerText="Total Diesel: "+total+" Ltr"}
function exportCSV(){let csv="Date,User,Vehicle,Site,Ltr,Opening,Closing,Run\n"+db.entries.map(e=>`${e.date},${e.user},${e.vehical},${e.site},${e.ltr},${e.open},${e.close},${e.close-e.open}`).join("\n");let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="mehadia_report.csv";a.click()}
</script>
</body>
</html>
